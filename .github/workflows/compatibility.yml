name: Compatibility

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Hyprland ${{ matrix.target }} baseline
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v0.56.2
            flake: github:hyprwm/Hyprland/v0.56.2
            # v0.56.2's lockfile selects glaze 8, but its CMake build requires glaze 7.
            nixpkgs: 12d28633cf8e2899ac83315a7e5495fda119d193
          - target: modern-1b85c7a
            flake: git+https://github.com/hyprwm/Hyprland?ref=main&rev=1b85c7aa1b5c41d906880f0f495bcd0749a23175&shallow=0
            nixpkgs: ''
    env:
      HYPRLAND_FLAKE: ${{ matrix.flake }}
      NIXPKGS_REF: ${{ matrix.nixpkgs }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: Build against Hyprland
        run: bash .github/scripts/compatibility.sh
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.target }}
          path: |
            build/compat/compatibility-report/
            build/compat/Testing/Temporary/LastTest.log
            build/compat/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  rolling:
    name: Hyprland ${{ matrix.target }} probe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - latest
          - main
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Hyprland revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ matrix.target }}" == "latest" ]]; then
            ref="$(gh api repos/hyprwm/Hyprland/releases/latest --jq '.tag_name')"
            flake="github:hyprwm/Hyprland/${ref}"
          else
            ref="main"
            rev="$(gh api repos/hyprwm/Hyprland/commits/main --jq '.sha')"
            # The github: fetcher omits revCount, which the development-version check needs.
            flake="git+https://github.com/hyprwm/Hyprland?ref=${ref}&rev=${rev}&shallow=0"
          fi
          printf 'HYPRLAND_FLAKE=%s\n' "$flake" >> "$GITHUB_ENV"
          printf 'Hyprland source: %s\n' "$flake"
          if [[ "$ref" == "v0.56.2" ]]; then
            printf 'NIXPKGS_REF=%s\n' '12d28633cf8e2899ac83315a7e5495fda119d193' >> "$GITHUB_ENV"
          fi
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: Build against Hyprland
        run: bash .github/scripts/compatibility.sh
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.target }}
          path: |
            build/compat/compatibility-report/
            build/compat/Testing/Temporary/LastTest.log
            build/compat/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
